<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetPrep</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url("/real-cost/fonts/BricolageGrotesque-800.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:400;font-display:swap;src:url("/real-cost/fonts/InstrumentSans-400.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:500;font-display:swap;src:url("/real-cost/fonts/InstrumentSans-500.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:600;font-display:swap;src:url("/real-cost/fonts/InstrumentSans-600.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:700;font-display:swap;src:url("/real-cost/fonts/InstrumentSans-700.woff2") format("woff2")}
:root{--bg:#F3F5F2;--surface:#fff;--ink:#121614;--muted:#5A635D;--mint:#7FE0B4;--mint-text:#1A7A55;--warn:#8A6500;--line:#E1E6E1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;font-size:16px;line-height:1.45}
h1,h2,.num{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(28px,3.4vw,40px);line-height:1.05}
h2{font-size:clamp(24px,2.6vw,32px);line-height:1.1}
h1:focus,h2:focus{outline:none}
p{margin:0}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
#scene:active{cursor:grabbing}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand svg{width:30px;height:30px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{position:fixed;left:20px;bottom:20px;width:min(400px,calc(100vw - 40px));max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:22px;padding:24px;box-shadow:0 12px 40px rgba(18,22,20,.12);z-index:2;display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none}
.lede{color:var(--muted);font-size:17px}
.btn{border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px 18px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[hidden]{display:none}
.btn.mint{background:var(--mint);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--mint-text);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}
/* day HUD */
.dayhud{position:fixed;left:20px;right:20px;bottom:20px;z-index:2;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;pointer-events:none}
.dayhud[hidden]{display:none}
.dayhud>*{pointer-events:auto}
.clockcard{background:var(--ink);color:#fff;border-radius:22px;padding:14px 20px;min-width:230px}
#clock{font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
#caption{font-size:17px;font-weight:600;color:var(--mint);margin-top:6px;min-height:25px}
#caption.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{background:var(--surface);border-radius:16px;padding:10px 14px;min-width:84px;box-shadow:0 6px 20px rgba(18,22,20,.08)}
.chip span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.chip b{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-variant-numeric:tabular-nums}
/* summary */
#sum-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
#sum-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
#sum-list b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-style:normal;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.tag.src{background:#E3F7EE;color:var(--mint-text)}.tag.rule{background:#EEF0EE;color:var(--muted)}
#scale{align-self:flex-start}
#spots,#binlabel,#info{position:fixed;left:0;top:0;z-index:1}
.spot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font:italic 700 16px/1 Georgia,serif;cursor:pointer;box-shadow:0 4px 12px rgba(18,22,20,.18)}
.spot[aria-expanded="true"]{background:var(--ink);color:#fff}
#binlabel{background:var(--surface);border-radius:14px;padding:8px 12px;font-size:14px;box-shadow:0 6px 20px rgba(18,22,20,.1);display:flex;flex-direction:column;gap:2px;max-width:210px;pointer-events:none}
#binlabel strong{font-size:15px}
#binlabel span{color:var(--muted);font-weight:600}
#binlabel ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 10px}
#binlabel li{display:flex;align-items:center;gap:5px;white-space:nowrap}
#binlabel i{width:10px;height:10px;border-radius:50%;display:inline-block}
#info{z-index:4;width:250px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 32px rgba(18,22,20,.25)}
#info[hidden]{display:none}
#info strong{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;padding-right:28px}
#info p{font-size:15px}
#info small{font-size:13px;color:#A3ADA6}
#info-close{position:absolute;right:8px;top:6px;width:32px;height:32px;border:0;background:none;color:#fff;font-size:22px;cursor:pointer}
body[data-step="day"] #spots,body[data-step="day"] #info{display:none}
.sponsor a{font-weight:700;color:var(--ink);font-size:15px;margin-top:2px}
/* cost */
label.sl{display:flex;justify-content:space-between;font-weight:600}
label.sl output{font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.totals div{background:var(--bg);border-radius:14px;padding:10px 12px}
.totals span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.totals b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;white-space:nowrap}
.sponsor{border:1.5px dashed #B9C2BB;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sponsor small{font-size:12px;font-weight:700;color:var(--muted)}
.sponsor .plogo svg{display:block;width:132px;height:auto;margin:4px 0 2px}
.sponsor strong{font-size:16px}
.sponsor p{font-size:14px;color:var(--muted)}
.curbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
/* result */
#promise{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
#promise li{padding-left:30px;position:relative;font-weight:500}
#promise li::before{content:"";position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:6px;border:2px solid var(--ink)}
#lead{display:flex;flex-direction:column;gap:8px}
#lead-note{margin:0;font-size:14px;color:var(--muted,#5B645E)}
#news{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:14px;border:1px solid var(--line);border-radius:14px}
#news[hidden]{display:none}
#news strong{font-size:15px}
#news label{font-size:14px;font-weight:600}
#news input[type=email]{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid #B9C2BB;width:100%;box-sizing:border-box}
#news label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--muted)}
#news label.chk input{flex:0 0 18px;height:18px;margin:1px 0 0}
#news-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#news-msg{font-size:14px;font-weight:600;color:var(--warn)}#news-msg:empty{display:none}
#news-done{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--mint-text)}
#news-other{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer}
details{font-size:14px;color:var(--muted)}summary{cursor:pointer;font-weight:600;color:var(--ink)}
@media (max-width:760px){
  #info{width:calc(100vw - 16px)}
  .panel{left:12px;right:12px;bottom:12px;width:auto;max-height:58vh;padding:18px;border-radius:22px 22px 18px 18px}
  .dayhud{left:12px;right:12px;bottom:12px}
  .clockcard{flex:1 1 100%}
  #clock{font-size:42px}
  body[data-step="intro"] #scene,body[data-step="sum"] #scene,body[data-step="cost"] #scene,body[data-step="result"] #scene{height:52vh}
}
@media (prefers-reduced-motion:reduce){#caption.pop{animation:none}}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(18,22,20,.55);overflow:auto;padding:16px}
#sheet[hidden]{display:none}
.sheet-bar{max-width:820px;margin:0 auto 12px;display:flex;gap:10px}
.sheet-bar .btn{flex:1}.sheet-bar .btn.ghost{background:#fff;flex:0 0 auto}
#sheet-page{max-width:820px;margin:0 auto;background:#fff;color:var(--ink);border-radius:16px;padding:36px 40px;font-size:15px;line-height:1.45}
#sheet-page header{position:static;display:flex;justify-content:space-between;align-items:center;padding:0;margin-bottom:18px}
#sheet-page .kick{color:var(--mint-text);font-weight:700}
#sheet-page h1{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0 0 6px}
#sheet-page h2{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;margin:22px 0 8px}
#sheet-page table{width:100%;border-collapse:collapse}
#sheet-page th{font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;font-size:13px}
#sheet-page td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
#sheet-page td:first-child{text-align:left;font-weight:500}
#sheet-page .tag{margin-left:8px}
#sheet-page .costs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#sheet-page .costs div{background:var(--bg);border-radius:12px;padding:10px 12px}
#sheet-page .costs span{display:block;font-size:13px;color:var(--muted)}
#sheet-page .costs b{font-size:18px}
#sheet-page .small{font-size:12.5px;color:var(--muted);margin:8px 0 0}
#sheet-page ul.chk{list-style:none;padding:0;margin:0}
#sheet-page ul.chk li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
#sheet-page ul.chk li::before{content:"";flex:0 0 16px;height:16px;border:1.5px solid var(--ink);border-radius:4px;margin-top:2px}
#sheet-page .sign{display:grid;grid-template-columns:2fr 2fr 1fr;gap:24px;margin-top:34px}
#sheet-page .sign div{border-top:1px solid var(--ink);padding-top:4px;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){#sheet-page{padding:22px 18px}#sheet-page h1{font-size:26px}#sheet-page .costs{grid-template-columns:1fr 1fr}#sheet-page th,#sheet-page td{padding:7px 3px;font-size:12px;white-space:nowrap}#sheet-page table .tag{display:none}}
@page{size:A4;margin:14mm}
@media print{
  body.sheet-open>*:not(#sheet){display:none!important}
  body.sheet-open{background:#fff;overflow:visible}
  #sheet{position:static;background:none;padding:0;overflow:visible}
  #sheet-page{max-width:none;border-radius:0;padding:0;font-size:10pt}
  #sheet-page td{padding:6px 8px}#sheet-page h1{font-size:24pt}#sheet-page ul.chk li{padding:2px 0}
  #sheet-page h2{margin:14px 0 6px}#sheet-page .sign{margin-top:26px}
  .no-print{display:none!important}
  #sheet-page .costs div,#sheet-page .tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body data-step="intro">
<canvas id="scene" aria-hidden="true"></canvas>

<div id="spots"></div>
<div id="binlabel" role="status"></div>
<div id="info" role="dialog" aria-labelledby="info-title" hidden><button id="info-close" type="button" aria-label="×">×</button><strong id="info-title"></strong><p id="info-text"></p><small id="info-src"></small></div>

<section class="panel" data-panel="intro">
  <h1 tabindex="-1" data-t="intro_h"></h1>
  <p class="lede" data-t="intro_p"></p>
  <div class="seg" id="stage" role="group">
    <button data-stage="adult" data-t="stage_adult" aria-pressed="true"></button><button data-stage="puppy" data-t="stage_puppy" aria-pressed="false"></button>
  </div>
  <button class="btn mint" data-go="day" data-t="start"></button>
  <p class="hint" data-t="drag"></p>
  <p class="hint" data-t="fig"></p>
</section>

<section class="dayhud" data-panel="day" hidden>
  <div class="clockcard"><div id="clock" class="num">06:30</div><div id="caption" role="status"></div></div>
  <div class="chips">
    <div class="chip"><span data-t="hud_meals"></span><b id="hud-meals">0</b></div>
    <div class="chip"><span data-t="hud_steps"></span><b id="hud-steps">0</b></div>
    <div class="chip"><span data-t="hud_min"></span><b id="hud-min">0</b></div>
    <div class="chip"><span data-t="hud_bags"></span><b id="hud-bags">0</b></div>
    <div class="chip" id="hud-outs-wrap" hidden><span data-t="hud_outs"></span><b id="hud-outs">0</b></div>
  </div>
  <button class="btn ghost" id="skip" data-t="skip" style="background:#fff"></button>
</section>

<section class="panel" data-panel="sum" hidden>
  <h2 tabindex="-1" data-t="sum_h"></h2>
  <p class="lede" data-t="sum_p"></p>
  <div class="seg" id="scale" role="group">
    <button data-scale="day" data-t="s_day"></button><button data-scale="week" data-t="s_week"></button><button data-scale="year" data-t="s_year"></button><button data-scale="life" data-t="s_life"></button>
  </div>
  <ul id="sum-list"></ul>
  <p class="hint" id="sum-note"></p>
  <button class="btn" data-go="cost" data-t="to_cost"></button>
  <button class="btn ghost" data-go="intro" data-t="again"></button>
</section>

<section class="panel" data-panel="cost" hidden>
  <h2 tabindex="-1" data-t="cost_h"></h2>
  <p class="lede" data-t="cost_p"></p>
  <div class="curbar"><span data-t="currency"></span><div class="seg" id="cur" role="group"><button data-cur="EUR">€</button><button data-cur="USD">$</button><button data-cur="GBP">£</button></div></div>
  <div><label class="sl" for="monthly"><span data-t="monthly"></span><output id="monthly-out"></output></label>
    <input type="range" id="monthly" min="40" max="400" step="1" value="116"></div>
  <div><label class="sl" for="setup"><span data-t="setup"></span><output id="setup-out"></output></label>
    <input type="range" id="setup" min="100" max="2000" step="1" value="560"></div>
  <div class="totals">
    <div><span data-t="c_day"></span><b id="c-day"></b></div>
    <div><span data-t="c_year"></span><b id="c-year"></b></div>
    <div><span data-t="c_life"></span><b id="c-life"></b></div>
  </div>
  <p class="hint" data-t="cost_note"></p>
  <p class="hint" id="rate-note"></p>
  <div class="sponsor">
    <small data-t="sponsor_k"></small>
