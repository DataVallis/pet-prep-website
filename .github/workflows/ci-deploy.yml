name: CI & Deploy

# Faster deploys (David 2026-11-03: A + B). Before: every run built the site twice (`next build` in
# "Lint, types, build" and again inside the Docker image job, which also exported ~500 MB of build
# cache), main repeated the whole PR pipeline, and the deploy shipped a 450 MB tarball — PR ~13 min,
# merge → live 17–20 min.
#
#   plan ── checks (lint, test, tsc, shellcheck) ──┐
#        └─ build (ONE next build in node:22-alpine,├─ green (marker web-green-<tree> + digest) ─ deploy
#                  package, smoke test, push GHCR) ─┘
#
# A: `next build` runs once, inside node:22-alpine (same libc as the image: sharp's native binary
#    matches); deploy/Dockerfile.prebuilt only packages it. After the smoke test same-repo runs push
#    ghcr.io/<owner>/petprep-website (per-run tag) and the deploy pulls exactly that DIGEST.
# B: a push / Run workflow on main whose git tree already has a green marker (an up-to-date PR, or an
#    earlier main run) skips checks + build and deploys that digest (deploy/ci-reuse-image.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # plan: marker artifacts + runs of this repository

jobs:
  plan:
    name: Plan (reuse a tested image?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      image: ${{ steps.reuse.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Git tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Reuse the image of a green run on this tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          TREE: ${{ steps.tree.outputs.tree }}
          WORKFLOW_FILE: ci-deploy.yml
        run: bash deploy/ci-reuse-image.sh

  checks:
    name: Lint, types, tests
    needs: plan
    if: needs.plan.outputs.image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      # Route types (PageProps, LayoutProps, RouteContext) without a build — the build job has it.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Shellcheck deploy scripts
        run: shellcheck deploy/deploy.sh deploy/ci-reuse-image.sh deploy/tests/ci-reuse-image.test.sh
      - name: Harness (ci-reuse-image.sh)
        run: bash deploy/tests/ci-reuse-image.test.sh

  build:
    name: Build, package, smoke test, push
    needs: plan
    if: needs.plan.outputs.image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: npm cache (alpine)
        uses: actions/cache@v4
        with:
          path: ~/.npm-alpine
          key: npm-alpine-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-alpine-

      # The one `next build` of this run (~7,600 prerendered pages), in the runtime's base image.
      # /investors prerenders the "12 Weeks" counts at build time: the read-only YouTube key is passed
      # by name (-e YOUTUBE_API_KEY, never on the command line) and is not part of the image.
      - name: next build (node:22-alpine)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -eu
          mkdir -p ~/.npm-alpine
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/app -w /app -v "$HOME/.npm-alpine":/npm-cache \
            -e npm_config_cache=/npm-cache -e HOME=/tmp -e YOUTUBE_API_KEY \
            -e NEXT_TELEMETRY_DISABLED=1 -e NEXT_PUBLIC_SITE_URL=https://petprep.si \
            node:22-alpine sh -c 'npm ci --no-audit --no-fund && npm run build'

      # node_modules in its own layer (changes only with dependencies); every mtime fixed so
      # identical files give an identical layer and the server pulls only what changed.
      - name: Stage the image content
        run: |
          set -eu
          # Same result as the full-build Dockerfile: standalone, then .next/static, public and
          # src/og laid over it (standalone already holds the traced parts of public/ and src/).
          rm -rf image && mkdir -p image/app
          mv .next/standalone/node_modules image/node_modules
          cp -a .next/standalone/. image/app/
          mkdir -p image/app/.next/static image/app/public image/app/src/og
          cp -a .next/static/. image/app/.next/static/
          cp -a public/. image/app/public/
          cp -a src/og/. image/app/src/og/
          test -f image/app/server.js && test -d image/node_modules/next && test -f image/app/src/og/mark.png
          find image -exec touch -h -d '@0' {} +
          du -sh image/node_modules image/app

      - name: Package the image
        env:
          TREE: ${{ needs.plan.outputs.tree }}
        run: |
          docker build -f deploy/Dockerfile.prebuilt -t petprep-website:ci \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.petprep.tree=${TREE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            image

      - name: Smoke test
        run: |
          set -eux
          docker run -d --name web -p 3000:3000 petprep-website:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<html lang="en"'
          curl -fsS http://127.0.0.1:3000/sl | grep -q '<html lang="sl"'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'petprep.si/sl/kako-deluje'
          curl -fsS -o /dev/null http://127.0.0.1:3000/llms.txt
          curl -fsS http://127.0.0.1:3000/sl/zivali/psi/labradorec | grep -q 'Labradorec'
          curl -fsS http://127.0.0.1:3000/registry/dog/index.sl.json | grep -q 'labradorec'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'petprep.si/animals/dogs/golden-retriever'
          curl -fsS -o /dev/null http://127.0.0.1:3000/en/opengraph-image
          # Breed share card with the AI portrait (a card without the photo is far smaller) —
          # also proves sharp's native binary works in the alpine image.
          test "$(curl -fsS http://127.0.0.1:3000/og/dog/labrador_retriever.sl.png | wc -c)" -gt 60000
          curl -fsS http://127.0.0.1:3000/sl/zivali/psi/labradorec | grep -q '/og/dog/labrador_retriever.sl.png?v='
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/pogoji)" = 308
          test "$(docker exec web id -u)" = 1001
          # The image's own health check (wget) works.
          docker exec web wget -q -O /dev/null http://127.0.0.1:3000/robots.txt
          docker rm -f web

      # Only now — the image passed the smoke test. Fork PRs build without pushing.
      - name: Push to GHCR (after the smoke test)
        id: push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TREE: ${{ needs.plan.outputs.tree }}
        run: |
          set -eu
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin > /dev/null
          repo="ghcr.io/${OWNER,,}/petprep-website"
          ref="${repo}:t-${TREE:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag petprep-website:ci "$ref"
          docker push -q "$ref" > /dev/null
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep -m1 "^${repo}@sha256:")"
          echo "image=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${digest}"
          docker logout ghcr.io > /dev/null

      # Keep the newest 40 versions (every same-repo run pushes one; markers live 14 days).
      - name: Prune old GHCR versions
        if: steps.push.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: petprep-website
          package-type: container
          min-versions-to-keep: 40

  # The single gate for PRs and automations (breed / language runbooks): green only when checks AND
  # build passed; uploads the marker for this tree with the image digest (B reads it on main).
  green:
    name: Website CI OK
    needs: [plan, checks, build]
    if: needs.checks.result == 'success' && needs.build.result == 'success' && needs.build.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write marker
        env:
          TREE: ${{ needs.plan.outputs.tree }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: printf '%s %s\nimage=%s\n' "$TREE" "$GITHUB_RUN_ID" "$IMAGE" > "${RUNNER_TEMP}/web-green.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: web-green-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/web-green.txt
          retention-days: 14
          overwrite: true

  deploy:
    name: Deploy to production (petprep.si)
    needs: [plan, checks, build, green]
    # Either the plan reused a tested image, or this run's checks + build + marker all passed.
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.plan.outputs.image != '' ||
       (needs.checks.result == 'success' && needs.build.result == 'success' && needs.green.result == 'success'))
    concurrency:
      group: website-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # the server pulls the image with this job's token
    environment:
      name: production
      url: https://petprep.si
    steps:
      - uses: actions/checkout@v4
      - name: Upload and deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST || '138.199.172.97' }}
          SSH_USER: ${{ secrets.PRODUCTION_USER || 'deploy' }}
          COMMIT_SHA: ${{ github.sha }}
          TREE: ${{ needs.plan.outputs.tree }}
          IMAGE_REF: ${{ needs.plan.outputs.image || needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          KLAVIYO_LIST_ID: ${{ secrets.KLAVIYO_LIST_ID }}
          # /investors: "12 Weeks" episodes and views (YouTube Data API v3, read-only key). Optional.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: the PRODUCTION_SSH_PRIVATE_KEY secret is not set for this repository."
            exit 1
          fi
          ref_re='^ghcr\.io/[a-z0-9-]+/petprep-website@sha256:[0-9a-f]{64}$'
          user_re='^[][A-Za-z0-9_.-]+$'
          if ! [[ "$IMAGE_REF" =~ $ref_re ]] || ! [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$REGISTRY_USER" =~ $user_re ]] \
             || ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: unexpected IMAGE_REF / TREE / REGISTRY_USER / COMMIT_SHA."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          echo "1. Uploading commit $COMMIT_SHA to /opt/petprep/website/incoming (deploy scripts)"
          $SSH "${SSH_USER}@${SSH_HOST}" "mkdir -p /opt/petprep/website/incoming"
          rsync -az --delete --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            -e "$SSH" ./ "${SSH_USER}@${SSH_HOST}:/opt/petprep/website/incoming/"

          echo "2. Runtime secrets"
          ENV_FILE=""
          if [ -n "$KLAVIYO_PRIVATE_API_KEY" ] && [ -n "$KLAVIYO_LIST_ID" ]; then
            ENV_FILE="$(printf 'KLAVIYO_PRIVATE_API_KEY=%s\nKLAVIYO_LIST_ID=%s\n' "$KLAVIYO_PRIVATE_API_KEY" "$KLAVIYO_LIST_ID")"
          else
            echo "WARNING: KLAVIYO_PRIVATE_API_KEY / KLAVIYO_LIST_ID not set — the early-access form will answer 503 until they are."
          fi
          if [ -n "$YOUTUBE_API_KEY" ]; then
            ENV_FILE="$(printf '%s\nYOUTUBE_API_KEY=%s\n' "$ENV_FILE" "$YOUTUBE_API_KEY")"
          else
            echo "NOTE: YOUTUBE_API_KEY not set — /investors hides the \"12 Weeks\" episode and view counts."
          fi
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" | $SSH "${SSH_USER}@${SSH_HOST}" "umask 077 && cat > /opt/petprep/website/.env"
            echo "Runtime settings written to /opt/petprep/website/.env"
          fi

          echo "3. Pulling ${IMAGE_REF} on the server and switching the website container"
          # The token goes over stdin (never on a command line); deploy.sh logs out right after the pull.
          # shellcheck disable=SC2029 # expanded here on purpose (validated above)
          printf '%s\n' "$REGISTRY_TOKEN" | $SSH "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io -u '${REGISTRY_USER}' --password-stdin > /dev/null 2>&1 || echo 'WARNING: ghcr.io login failed'; IMAGE_REF=${IMAGE_REF} EXPECT_TREE=${TREE} bash /opt/petprep/website/incoming/deploy/deploy.sh /opt/petprep/website/incoming ${COMMIT_SHA} < /dev/null; rc=\$?; docker logout ghcr.io > /dev/null 2>&1; exit \$rc"

      # IndexNow (David 2026-10-31, M6-K): tell Bing (→ ChatGPT, Copilot) and other IndexNow
      # engines about every URL in the sitemap after a deploy. Key file: public/f1404c440df09203fa7aeccfaa86137d.txt.
      # Never fails the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: f1404c440df09203fa7aeccfaa86137d
        run: |
          set -euo pipefail
          sleep 20
          curl -fsS https://petprep.si/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | sort -u > urls.txt
          echo "URLs: $(wc -l < urls.txt)"
          jq -Rn --arg key "$INDEXNOW_KEY" '{host:"petprep.si",key:$key,keyLocation:("https://petprep.si/"+$key+".txt"),urlList:[inputs]}' < urls.txt > body.json
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json
