name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Shellcheck deploy script
        run: shellcheck deploy/deploy.sh

  image:
    name: Docker image (build + smoke test, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: petprep-website:ci
          # Same secret as the deploy build: BuildKit does not key the cache on secret values, so the
          # deploy reuses this build stage — it must already contain the "12 Weeks" counts.
          secrets: |
            youtube_api_key=${{ secrets.YOUTUBE_API_KEY }}
          cache-from: type=gha,scope=petprep-website
          cache-to: type=gha,mode=max,scope=petprep-website
      - name: Smoke test
        run: |
          set -eux
          docker run -d --name web -p 3000:3000 petprep-website:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<html lang="en"'
          curl -fsS http://127.0.0.1:3000/sl | grep -q '<html lang="sl"'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'petprep.si/sl/kako-deluje'
          curl -fsS -o /dev/null http://127.0.0.1:3000/llms.txt
          curl -fsS http://127.0.0.1:3000/sl/zivali/psi/labradorec | grep -q 'Labradorec'
          curl -fsS http://127.0.0.1:3000/registry/dog/index.sl.json | grep -q 'labradorec'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'petprep.si/animals/dogs/golden-retriever'
          curl -fsS -o /dev/null http://127.0.0.1:3000/en/opengraph-image
          # Breed share card with the AI portrait (a card without the photo is far smaller).
          test "$(curl -fsS http://127.0.0.1:3000/og/dog/labrador_retriever.sl.png | wc -c)" -gt 60000
          curl -fsS http://127.0.0.1:3000/sl/zivali/psi/labradorec | grep -q '/og/dog/labrador_retriever.sl.png?v='
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/pogoji)" = 308
          test "$(docker exec web id -u)" = 1001
          docker rm -f web

  deploy:
    name: Deploy to production (petprep.si)
    needs: [checks, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: website-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://petprep.si
    steps:
      - uses: actions/checkout@v4
      # The image is built here, not on the server (2026-11-02): with 15 languages `next build`
      # prerenders ~7,000 pages and peaks at ~2 GB RAM, which the 4 GB API server cannot spare
      # (the build was killed mid-way, ssh exit 255). The runner reuses the `image` job's cache.
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: petprep-website:next
          build-args: NEXT_PUBLIC_SITE_URL=https://petprep.si
          # /investors: "12 Weeks" counts are prerendered at build time (BuildKit secret, not in the image).
          secrets: |
            youtube_api_key=${{ secrets.YOUTUBE_API_KEY }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=petprep-website
      - name: Export the image
        run: |
          docker save petprep-website:next | gzip -1 > website-image.tar.gz
          ls -lh website-image.tar.gz
      - name: Upload and deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST || '138.199.172.97' }}
          SSH_USER: ${{ secrets.PRODUCTION_USER || 'deploy' }}
          COMMIT_SHA: ${{ github.sha }}
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          KLAVIYO_LIST_ID: ${{ secrets.KLAVIYO_LIST_ID }}
          # /investors: "12 Weeks" episodes and views (YouTube Data API v3, read-only key). Optional.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: the PRODUCTION_SSH_PRIVATE_KEY secret is not set for this repository."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          echo "1. Uploading commit $COMMIT_SHA to /opt/petprep/website/incoming"
          $SSH "${SSH_USER}@${SSH_HOST}" "mkdir -p /opt/petprep/website/incoming"
          rsync -az --delete --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude 'website-image.tar.gz' \
            -e "$SSH" ./ "${SSH_USER}@${SSH_HOST}:/opt/petprep/website/incoming/"
          echo "   and the image built on the runner"
          rsync -a --partial -e "$SSH" website-image.tar.gz "${SSH_USER}@${SSH_HOST}:/opt/petprep/website/website-image.tar.gz"

          echo "2. Runtime secrets"
          ENV_FILE=""
          if [ -n "$KLAVIYO_PRIVATE_API_KEY" ] && [ -n "$KLAVIYO_LIST_ID" ]; then
            ENV_FILE="$(printf 'KLAVIYO_PRIVATE_API_KEY=%s\nKLAVIYO_LIST_ID=%s\n' "$KLAVIYO_PRIVATE_API_KEY" "$KLAVIYO_LIST_ID")"
          else
            echo "WARNING: KLAVIYO_PRIVATE_API_KEY / KLAVIYO_LIST_ID not set — the early-access form will answer 503 until they are."
          fi
          if [ -n "$YOUTUBE_API_KEY" ]; then
            ENV_FILE="$(printf '%s\nYOUTUBE_API_KEY=%s\n' "$ENV_FILE" "$YOUTUBE_API_KEY")"
          else
            echo "NOTE: YOUTUBE_API_KEY not set — /investors hides the \"12 Weeks\" episode and view counts."
          fi
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" | $SSH "${SSH_USER}@${SSH_HOST}" "umask 077 && cat > /opt/petprep/website/.env"
            echo "Runtime settings written to /opt/petprep/website/.env"
          fi

          echo "3. Loading the image and switching the website container"
          $SSH "${SSH_USER}@${SSH_HOST}" \
            "IMAGE_TAR=/opt/petprep/website/website-image.tar.gz bash /opt/petprep/website/incoming/deploy/deploy.sh /opt/petprep/website/incoming $COMMIT_SHA"

      # IndexNow (David 2026-10-31, M6-K): tell Bing (→ ChatGPT, Copilot) and other IndexNow
      # engines about every URL in the sitemap after a deploy. Key file: public/f1404c440df09203fa7aeccfaa86137d.txt.
      # Never fails the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: f1404c440df09203fa7aeccfaa86137d
        run: |
          set -euo pipefail
          sleep 20
          curl -fsS https://petprep.si/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | sort -u > urls.txt
          echo "URLs: $(wc -l < urls.txt)"
          jq -Rn --arg key "$INDEXNOW_KEY" '{host:"petprep.si",key:$key,keyLocation:("https://petprep.si/"+$key+".txt"),urlList:[inputs]}' < urls.txt > body.json
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json
